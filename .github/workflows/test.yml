# The suite, on every push and pull request.
#
# There is no install step and there is nothing to cache, because there are no
# dependencies -- that is the point of the project, so the workflow is allowed to be
# this short. `npm ci` would fail here anyway: there is no lockfile, because there is
# nothing to lock.
#
# `counts:check` runs BEFORE the tests and is not merely cosmetic: the documented test
# count has drifted out of step three times, and each time the docs went on asserting a
# stale number that nobody noticed. It is a --check here rather than a --fix, because CI
# reports and does not rewrite.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # engines says ">=22". 22 is the floor the project promises; 24 catches what the
        # next LTS changes under it before a user does. macOS is in the matrix because
        # BlockYard runs on the node's machine and a Mac is one of them (2026-09-14): the
        # suite had never run there before the first Mac install was attempted.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    steps:
      # v4 targets Node 20, which GitHub deprecated -- the runner force-ran it on 24 and said
      # so in an annotation on the first run. v7 is current for both.
      # PINNED BY COMMIT (2026-09-16, audit L17): a tag can be moved to other code by whoever
      # controls the action's repository; a full SHA cannot. The comment names the tag each was
      # resolved from (gh api repos/actions/<name>/git/ref/tags/v7), and .github/dependabot.yml
      # proposes the bump when a new release comes out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: node and npm versions
        run: node -v && npm -v

      - name: the documented test count matches the suite
        run: npm run counts:check

      - name: unit tests
        run: npm test
